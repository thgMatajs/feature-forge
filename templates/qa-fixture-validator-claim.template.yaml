# Validator-claim fixture template — input pra subprocess do sandbox.
# Auditor preenche shape que DEVERIA fazer o validator falhar.

fixture_id: "{{fixture_id}}"
target_validator: "{{validator_path}}"
language: "yaml"

input: {}                              # payload sintético preenchido pelo auditor

claim:
  what_validator_says: "{{claim}}"     # docstring/spec do validator
  what_we_test: "{{counter_example}}"  # contra-exemplo que viola o claim
  expected_exit_code: 1                # validator deveria sinalizar falha
