# cards/crashlytics/card.yaml
# ──────────────────────────────────────────────────────────────────────────
# Schema version: 1
# Card: Firebase Crashlytics — crash reporting + non-fatal exceptions.
# Padrão canônico: exception class compartilhada por feature em
# shared/feature/{name}/.../analytics/Firebase{Feature}AnalyticsException.kt
# com errorCode + causeType, garantindo paridade Android↔iOS quando eventos
# *_error chamam Firebase.crashlytics.recordException(...).
# ──────────────────────────────────────────────────────────────────────────

schema-version: 1


# ── IDENTITY ──────────────────────────────────────────────────────────────
identity:
  name:         crashlytics
  version:      1.0.0
  description:  "Firebase Crashlytics para reporte de crashes + non-fatal exceptions. Padrão de exception class compartilhada por feature (ex.: FirebaseAuthAnalyticsException) com errorCode + causeType para paridade Android↔iOS."
  category:     observability
  maturity:     stable
  maintainer:   feature-forge-core
  created-at:   2026-05-29
  last-updated: 2026-05-29
  license:      MIT


# ── CAPABILITIES ──────────────────────────────────────────────────────────
provides:
  - crash-reporting
  - crashlytics


# ── DEPENDENCIES ──────────────────────────────────────────────────────────
requires: []


# ── CONFLICTS ─────────────────────────────────────────────────────────────
# Qualquer outro provider de crash-reporting (Sentry, Bugsnag, Datadog RUM
# crash module, etc.) ocupa a mesma capability label e conflita.
conflicts-with:
  - crash-reporting


# ── CONTRIBUTIONS ─────────────────────────────────────────────────────────
contributes:

  # Template fragments — adicionados a documentos canônicos do feature package
  templates:
    - target:  tech-spec.md
      section: "Observability — Crashlytics"
      file:    templates/crashlytics-tech-spec.md
      merge:   append-section

    - target:  analytics-spec.yaml
      section: "crashlytics-binding"
      file:    templates/crashlytics-analytics.yaml
      merge:   merge-keys

  # Validators — checagem estática contra eventos *_error sem exception class
  validators:
    - name:        validate-crashlytics-shared-exception
      file:        validators/check-crashlytics-shared-exception.py
      runs-on:     [pre-commit, verify-task]
      severity:    error
      description: "Garante que todo evento analytics terminando em _error está vinculado a exception class compartilhada Firebase{Feature}AnalyticsException(errorCode, causeType)"

  # Agent prompts — fragments injetados em sub-agents nos extension-points
  agent-prompts:
    - inject-into:     contract-planner-agent
      extension-point: "section:Analytics Contract"
      file:            agent-contributions/contract-planner-additions.md

    - inject-into:     tech-spec-agent
      extension-point: "section:Observability hooks"
      file:            agent-contributions/tech-spec-additions.md

    - inject-into:     task-contract-writer
      extension-point: "after:Allowed Files"
      file:            agent-contributions/task-writer-additions.md

  # Config defaults — convenções canônicas de crash reporting
  config-defaults:
    conventions.observability.crash-reporting: "crashlytics"
    conventions.observability.crashlytics-exception-pattern: "Firebase{Feature}AnalyticsException(errorCode, causeType)"


# ── DETECTION ─────────────────────────────────────────────────────────────
detection:
  signals:
    - type:       gradle-dep
      coordinate: "com.google.firebase:firebase-crashlytics"
      confidence: 0.5

    - type:       file-content
      glob:       "**/build.gradle*"
      contains:   "com.google.firebase.crashlytics"
      confidence: 0.3

    - type:       file-content
      glob:       "**/Package.swift"
      contains:   "FirebaseCrashlytics"
      confidence: 0.3

    - type:       file-content
      glob:       "**/Podfile"
      contains:   "FirebaseCrashlytics"
      confidence: 0.3

  threshold: 0.5


# ── DOCUMENTATION ─────────────────────────────────────────────────────────
documentation:
  readme:     README.md
  rules-link: "observability"
