# cards/firebase-crashlytics/detection/signals.yaml
# Espelha o bloco `detection:` do card.yaml. Mantido aqui para que tools
# de inspeção/auditoria possam ler o arquivo dedicado sem reabrir o card.

threshold: 0.5

signals:
  - id:         gradle-dependency
    type:       gradle-dep
    coordinate: "com.google.firebase:firebase-crashlytics"
    confidence: 0.5
    note:       "Dependência runtime do SDK Android — sinal mais forte. Migrado de file-content em DET-3 (libs.versions.toml + build.gradle)."

  - id:         gradle-plugin
    type:       file-content
    glob:       "**/build.gradle*"
    contains:   "com.google.firebase.crashlytics"
    confidence: 0.3
    note:       "Plugin Gradle que faz upload de mapping files."

  - id:         spm-package
    type:       file-content
    glob:       "**/Package.swift"
    contains:   "FirebaseCrashlytics"
    confidence: 0.3
    note:       "Swift Package Manager (sem CocoaPods, padrão MeoBonsai)."

  - id:         podfile
    type:       file-content
    glob:       "**/Podfile"
    contains:   "FirebaseCrashlytics"
    confidence: 0.3
    note:       "CocoaPods fallback para projetos legados."

alternative-cards:
  - sentry
  - bugsnag
