# cards/ktor-client/card.yaml
# ──────────────────────────────────────────────────────────────────────────
# Schema version: 1
# Ktor Client como HTTP client cross-platform (KMP). Provê HTTP transport
# para o axis `data` (cell-cardinality enforçada per (data, platform) pelo
# schema do workflow-config — DET-6). Ancora configuração canônica do
# HttpClient (ContentNegotiation + Json injetado, Logging, HttpTimeout,
# Auth com refresh-token, retry), dispatcher injection no construtor,
# engines por plataforma (OkHttp / Darwin / Js), error mapping de status
# HTTP para domain errors, proibição de Retrofit/manual-parsing no
# commonMain.
# ──────────────────────────────────────────────────────────────────────────

schema-version: 1


# ── IDENTITY ──────────────────────────────────────────────────────────────
identity:
  name:         ktor-client
  version:      1.0.0
  description:  "Ktor Client como HTTP client cross-platform (KMP). Configuração canônica com ContentNegotiation/Json, Logging, Auth plugin, retry policy. Dispatcher injection no construtor."
  category:     data
  maturity:     stable
  maintainer:   feature-forge-core
  created-at:   2026-05-29
  last-updated: 2026-06-10
  license:      MIT


# ── CAPABILITIES ──────────────────────────────────────────────────────────
# Singular legada da família network foi removida em W3 (DET-6) —
# cardinalidade per (data, platform) cell é enforçada pelo schema do
# workflow-config; ver capability-labels.md §Migração v1.2 (DET-6). Cards
# de backend axis podem ter `provides: []` — sua identidade vem do cell
# (axis, platform) no workflow-config, não de label singular (CARD-006
# relax pra backend axes em engine/cards/loader.py).
provides: []


# ── DEPENDENCIES ──────────────────────────────────────────────────────────
# Requer Kotlin Multiplatform (engine de shared module ativo) e o
# serializador JSON canônico — ContentNegotiation usa `kotlinx.serialization`
# via plugin `ktor-serialization-kotlinx-json`.
requires:
  - kotlin-multiplatform
  - serialization-json


# ── CONFLICTS ─────────────────────────────────────────────────────────────
# Sem `conflicts-with` por label singular — schema enforça 1 card per
# (data, platform) cell no workflow-config. Cards alternativos
# (okhttp-direct, cio-only-rest, retrofit-client) coabitam o catalog sem
# precisar declarar conflito por label aqui.
conflicts-with: []


# ── CONTRIBUTIONS ─────────────────────────────────────────────────────────
contributes:

  # Templates — fragments inseridos em feature package documents
  templates:
    - target:  tech-spec.md
      section: "Network — Ktor Client"
      file:    templates/ktor-client-tech-spec.md
      merge:   append-section

  # Validators — scripts que rodam em pontos do lifecycle
  validators:
    - name:        check-no-blocking-http
      file:        validators/check-no-blocking-http.py
      runs-on:     [pre-commit, verify-task]
      severity:    error
      description: "Bloqueia runBlocking envolvendo HttpClient calls (Main thread freeze)"

  # Agent prompts — fragments injected into sub-agents at extension points
  agent-prompts:
    - inject-into:     tech-spec-agent
      extension-point: "section:Data layer"
      file:            agent-contributions/tech-spec-additions.md

    - inject-into:     contract-planner-agent
      extension-point: "section:Data Contract"
      file:            agent-contributions/contract-planner-additions.md

    - inject-into:     task-contract-writer
      extension-point: "after:Allowed Files"
      file:            agent-contributions/task-writer-additions.md

  # Config defaults — convenções canônicas de HTTP client
  config-defaults:
    conventions.network.http-client:   "ktor-client"
    conventions.network.engine-android: "okhttp"
    conventions.network.engine-ios:     "darwin"
    conventions.network.json-config:    "ContentNegotiation Json { ignoreUnknownKeys=true }"


# ── DETECTION ────────────────────────────────────────────────────────────
# Threshold cumulativo: 0.5
#   - gradle-dep   io.ktor:ktor-client-core    → 0.5  (primário, TOML-aware)
#   - build.gradle* contém "io.ktor:ktor-client-" → 0.3  (legacy/variantes)
#   - *.kt contém "HttpClient("                 → 0.3
#   - *.kt contém "io.ktor.client"              → 0.2
# Soma máxima: 1.3 (sanity ≤ 2.0 — CARD-016).
# Espelha cards/ktor-client/detection/signals.yaml — fonte canônica de
# rationale por signal. SPEC DET-3 §AC-1: ktor-client é exemplo canônico
# do gradle-dep signal em projeto TOML-only.
detection:
  signals:
    - type:       gradle-dep
      coordinate: "io.ktor:ktor-client-core"
      confidence: 0.5

    - type:       file-content
      glob:       "**/build.gradle*"
      contains:   "io.ktor:ktor-client-"
      confidence: 0.3

    - type:       file-content
      glob:       "**/*.kt"
      contains:   "HttpClient("
      confidence: 0.3

    - type:       file-content
      glob:       "**/*.kt"
      contains:   "io.ktor.client"
      confidence: 0.2

  threshold: 0.5


# ── DOCUMENTATION ─────────────────────────────────────────────────────────
documentation:
  readme:     README.md
  rules-link: "architecture_kmp"
