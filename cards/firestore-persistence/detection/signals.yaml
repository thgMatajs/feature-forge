# cards/firestore-persistence/detection/signals.yaml
# ──────────────────────────────────────────────────────────────────────────
# Sinais de detecção de Cloud Firestore como persistência server-side.
# Espelha o bloco detection.signals do card.yaml (fonte canônica).
# Threshold cumulativo 0.5 — auto-ativa quando confiança somada ≥ 0.5.
#
# Nota: este card cobre CRUD/queries/batch. Realtime listeners e security
# rules têm cards próprios (`firestore-realtime`, `firestore-security-rules`)
# com sinais distintos (presença de `snapshotListener`/`addSnapshotListener`
# para realtime; `firestore.rules` para rules). Aqui focamos em SDK presente
# + estruturas de índice/persistência.
# ──────────────────────────────────────────────────────────────────────────

signals:
  - type:       file-exists
    glob:       "**/google-services.json"
    confidence: 0.2
    rationale:  "App Android conectado a um projeto Firebase. Não basta sozinho — outro produto Firebase poderia estar em uso."

  - type:       gradle-dep
    coordinate: "com.google.firebase:firebase-firestore"
    confidence: 0.5
    rationale:  "Dependência explícita do SDK Firestore (libs.versions.toml ou build.gradle). Sinal mais forte para Android/KMP. Migrado de file-content em DET-3."

  - type:       file-exists
    glob:       "**/firestore.indexes.json"
    confidence: 0.2
    rationale:  "Índices compostos declarados — só fazem sentido com queries Firestore em uso (não-realtime ou realtime)."

  - type:       file-content
    glob:       "**/Package.swift"
    contains:   "FirebaseFirestore"
    confidence: 0.3
    rationale:  "Dependência SPM iOS (sem CocoaPods)."

  - type:       file-content
    glob:       "**/Podfile"
    contains:   "FirebaseFirestore"
    confidence: 0.3
    rationale:  "Dependência iOS via CocoaPods (fallback para projetos que não migraram para SPM)."

threshold: 0.5
