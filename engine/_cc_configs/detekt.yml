# Forge-managed Detekt config TEMPLATE for the cyclomatic-complexity gate.
# Only the CyclomaticComplexMethod rule is active — every other Detekt
# category is explicitly disabled so the gate emits exactly one signal.
#
# Threshold is dynamic — Detekt does not accept per-rule threshold via CLI,
# so check_cyclomatic_complexity._dispatch_tool renders this template into
# a tempfile, substituting __CC_THRESHOLD__ with the resolved value (card
# override > workflow-config > DEFAULTS_CC). Spec §3: threshold via CLI
# args **sempre** — honored here by per-invocation tempfile render.

build:
  maxIssues: 0
  weights:
    complexity: 1

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: __CC_THRESHOLD__  # rendered per-invocation by _dispatch_tool
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: false
    ignoreNestingFunctions: false

# Disable every other category — gate is single-purpose.
comments:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
naming:
  active: false
performance:
  active: false
potential-bugs:
  active: false
style:
  active: false
